<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, initial-scale=1.0'>
		<script src="https://kit.fontawesome.com/7ea39dcb5e.js" crossorigin="anonymous"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
		<link rel='stylesheet' href='css/variables.css'>
		<link rel='stylesheet' href='css/reset.css'>
		<link rel='stylesheet' href='css/base.css'>
		<link rel='stylesheet' href='css/layout.css'>
		<link rel='stylesheet' href='css/components.css'>
		<link rel='stylesheet' href='css/typography.css'>
		<link rel='stylesheet' href='css/theme.css'>
		<link rel='stylesheet' href='css/state.css'>
		<link rel='stylesheet' href='css/animations.css'>
		<title>Home Page</title>
	</head>

	<body class='body'>
		<header class='header'>
			<input id='theme__checkbox' type='checkbox'>
			<label class='theme__label' for='theme__checkbox'>
				<i class="fa-solid fa-circle-half-stroke fa-2xl"></i>
			</label>
		</header>
		<section class='header__section'>
			<h1 class='h1'>Get In </span><span class='attn'>Touch</span></h1>
		</section>	
		<main class='main'>
			<section class='contact'>
				<div class='contact__container'>
					<div class='contact__subcontainer'>
						<div class='contact-h2__container'>
							<h2 class='h2'>Thanks for stopping by!</h2>
							<p>Feel free to reach out. I'm always open to discussing new projects, creative ideas or opportunities.</p>
						</div>

						<div class='email-socials__container'>
							<div class='email__container'>
								<div class='big-icon__container'><i class='fa-solid fa-envelope-open fa-2xl'></i></div>
								<div class='email-h3__container'>
									<h3 class='h3'>Mail Me</h3>
									<span class=''>ken@gmail.com</span>
								</div>
							</div>

							<div class='socials__container'>
								<div class='big-icon__container'><i class="fa-solid fa-share-from-square fa-2xl"></i></div>
								<div class='socials-h3__container'>
									<h3 class='h3'>Or Reach Me At</h3>
									<div class='socials-icon__container'>
										<i class="fa-brands fa-twitter fa-lg"></i>
										<i class="fa-brands fa-facebook fa-lg"></i>
										<i class="fa-brands fa-linkedin fa-lg"></i>
										<i class="fa-brands fa-github fa-lg"></i>
									</div>
								</div>
							</div>
						</div>
					</div>
					
					<form class='contactForm' name='contactForm'>
						<input id='visitorName' type='text' placeholder='Your name'>
						<input id='visitorEmail' type='text' placeholder='Your email'>
						<input id='visitorSubject' type='text' placeholder='Your subject'>
						<textarea id='visitorMsg' placeholder='Your message'></textarea>
					</form>
				</div>
				
				<div class='btn__container'>
					<button class='hero__btn'><span class='btn__text'>send message</span></button>
					<i class="btn__icon fa-solid fa-arrow-right fa-lg"></i>
				</div>
			</section>
		</main>
				<nav class='bottom-nav'>
			<ul class='menu'>
				<li class='menu__icon'>
					<a href="index.html">
						<span class='fa-stack small'>
							<i class="fa-solid fa-circle fa-stack-2x"></i><i class=" fa-stack-1x fa-solid fa-house-chimney"></i>
						</span>
					</a>
				</li>
				<li class='menu__icon'>
					<a href='portfolio.html'>
						<span class='fa-stack small'>
							<i class="fa-solid fa-circle fa-stack-2x"></i><i class=" fa-stack-1x fa-solid fa-briefcase"></i>
						</span>
					</a>
				</li>
				<li class='menu__icon current-page'>
					<a href='contact.html'>
						<span class='fa-stack small'>
							<i class="fa-solid fa-circle fa-stack-2x"></i><i class=" fa-stack-1x fa-solid fa-envelope-open"></i>
						</span>
					</a>
				</li>
				<li class='menu__icon'>
					<a href='blog.html'>
						<span class='fa-stack small'>
							<i class="fa-solid fa-circle fa-stack-2x"></i><i class=" fa-stack-1x fa-solid fa-comment-dots"></i>
						</span>
					</a>
				</li>
			</ul>
		</nav>
	</body>
</html>
